[project]
name = "twinpay-agents"
version = "0.1.0"
description = "TwinPay's Band-connected engineering agents"
requires-python = ">=3.11,<3.14"
dependencies = [
    "band-sdk[codex]==4.0.0",
    "python-dotenv>=1.0.0,<2",
]

[project.scripts]
twinpay-agent = "twinpay_agents.agent:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinpay_agents"]
